services:
  api:
    build: .
    image: alghaza/swave-backend:latest
    ports:
      - "5500:5500"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -c "
      bunx prisma migrate deploy &&
      bun run dev
      "

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rendang
      POSTGRES_DB: db_swave
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_swave"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres-data: